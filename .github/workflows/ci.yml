name: WIZP CI/CD

on:
  push:
    branches: [main, develop]
    tags: ['v*']
  pull_request:
    branches: [main]

jobs:
  lint:
    name: Lint & Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Zig
        uses: mlugg/setup-zig@v2
        with:
          version: '0.17.1'

      - name: Install frontend dependencies
        run: cd frontend && npm ci

      - name: Check dependency lock consistency
        run: python3 scripts/check_dependency_consistency.py

      - name: Zig format check
        run: zig fmt --check src/

      - name: Frontend format check
        run: cd frontend && npx prettier --check src/ bridge.ts svelte-entry.ts

      - name: Frontend lint
        run: cd frontend && npx eslint src/ bridge.ts svelte-entry.ts

      - name: Shell script lint
        run: |
          sudo apt-get install -y shellcheck
          shellcheck -x scripts/*.sh

  fuzz:
    name: Fuzz Tests
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Zig
        uses: mlugg/setup-zig@v2
        with:
          version: '0.17.1'

      - name: Run fuzz tests (30s budget)
        run: zig build test -Doptimize=ReleaseSafe -Dtarget=x86_64-linux-gnu -- 2>&1 | head -100
        timeout-minutes: 5

  test:
    name: Test & Build
    runs-on: ubuntu-latest
    needs: lint
    strategy:
      matrix:
        zig: ['0.17.1']
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: |
          npm ci
          cd frontend && npm ci

      - name: Verify package publication ages
        run: node scripts/verify-package-age.js

      - name: Setup Zig
        uses: mlugg/setup-zig@v2
        with:
          version: ${{ matrix.zig }}
      - name: Run tests
        run: zig build test -Doptimize=ReleaseSafe -Dtarget=x86_64-linux-gnu

      - name: Build ReleaseSafe
        run: zig build -Doptimize=ReleaseSafe -Dtarget=x86_64-linux-gnu

      - name: Build ReleaseSmall
        run: zig build -Doptimize=ReleaseSmall -Dtarget=x86_64-linux-gnu

      - name: Check binary size
        run: ls -lh zig-out/bin/wizp

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: wizp-linux-x86_64
          path: zig-out/bin/wizp

  release:
    name: Release
    needs: test
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Zig
        uses: mlugg/setup-zig@v2
        with:
          version: '0.17.1'
      - name: Build ReleaseSafe
        run: zig build -Doptimize=ReleaseSafe -Dtarget=x86_64-linux-gnu

      - name: Package
        run: |
          cd zig-out/bin
          tar czf wizp-linux-x86_64.tar.gz wizp
          sha256sum wizp-linux-x86_64.tar.gz > wizp-linux-x86_64.tar.gz.sha256

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          files: |
            zig-out/bin/wizp-linux-x86_64.tar.gz
            zig-out/bin/wizp-linux-x86_64.tar.gz.sha256
          generate_release_notes: true
